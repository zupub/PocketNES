; PlatformIO Project Configuration File
;
; Retro-Go NES (nofrendo) port for ESP32-S3 + ST7789 240x320
; Framework sources come from retro-go components/retro-go (copied to src/rg_core)
;
; Two hardware targets share this codebase; select with -e:
;   pio run -e nes-s3-st7789       8-button board (no backlight GPIO, no BLE)
;   pio run -e nes-s3-st7789-ble   2.8" BLE board (shared buttons, PWM backlight,
;                                  soft-power key, BLE gamepad, boot logo)
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[nes]
platform = espressif32 @ ~6.5.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.arduino.memory_type = qio_opi
board_build.partitions = partitions_nes.csv
; LovyanGFX and NimBLE-Arduino live in lib/ (local libraries, no download
; needed). "chain+" follows the #include lines of our sources into the
; libraries before deciding what to compile. Note: the LDF preprocessor does
; NOT see macros passed via build_flags, which is why ble_gamepad.cpp keeps
; its #includes outside the #if RG_INPUT_BLE_GAMEPAD guard (see that file).
; The BLE env builds NimBLE, the non-BLE env links none of it.
lib_ldf_mode = chain+
; If your module has 16MB flash (N16R8), uncomment the next line:
; board_upload.flash_size = 16MB

build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D CORE_DEBUG_LEVEL=3
    -D BOARD_HAS_PSRAM
    ; --- Retro-Go: tuning (replaces base.cmake); target is selected per env ---
    -D RETRO_GO=1
    -D RG_ENABLE_NETWORKING=0
    -D RG_UPDATER_ENABLE=0
    -D RG_PROJECT_APP='"nes"'
    -D RG_SINGLE_APP=1
    ; --- LovyanGFX ---
    ; The efont/IPA tables in LovyanGFX are ~120MB of C source. They are not
    ; used (Chinese glyphs come from src/rg_core/fonts/efontCN16.c), so skip them.
    -D LGFX_DISABLE_LARGE_FONTS=1
    -fjump-tables
    -ftree-switch-conversion
    -O2
    -Wno-unused-function
    ; --- Include paths ---
    -I src/rg_core
    -I src/rg_core/libs/cJSON
    -I src/rg_core/libs/lodepng
    -I src/nofrendo

[env:nes-s3-st7789]
extends = nes
; Boot logo: embedded into the firmware (symbols _binary_startup_png_start/_end);
; decoded with lodepng at boot and shown before the emulator starts. Requires
; RG_BOOT_LOGO (defined in targets/my-s3-st7789/config.h) - the two must
; be enabled together, or linking fails on the missing startup.png symbols.
board_build.embed_files = startup.png
build_flags =
    ${nes.build_flags}
    -D RG_TARGET_MY_S3_ST7789=1

[env:nes-s3-st7789-ble]
extends = nes
; Boot logo: same startup.png as the base env (see above). Requires
; RG_BOOT_LOGO (defined in targets/my-s3-st7789-ble/config.h).
board_build.embed_files = startup.png
; NimBLE-Arduino is auto-detected from lib/NimBLE-Arduino through the
; #include <NimBLEDevice.h> in ble_gamepad.cpp - no lib_deps needed.
build_flags =
    ${nes.build_flags}
    -D RG_TARGET_MY_S3_ST7789_BLE=1
