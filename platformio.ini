; PlatformIO Project Configuration File
;
; Retro-Go NES (nofrendo) port for ESP32-S3 + ST7789 240x320
; Framework sources come from retro-go components/retro-go (copied to src/rg_core)
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:nes-s3-st7789]
platform = espressif32 @ ~6.5.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.arduino.memory_type = qio_opi
board_build.partitions = partitions_nes.csv
; Boot logo: startup.png is embedded into the firmware (symbols
; _binary_startup_png_start/_end), decoded with lodepng at boot and shown
; before the emulator starts. Requires RG_BOOT_LOGO (defined in
; targets/my-s3-st7789/config.h) - the two must be enabled together, or
; linking fails on the missing startup.png symbols.
board_build.embed_files = startup.png
; LovyanGFX lives in lib/LovyanGFX (local library, no download needed).
; "chain+" follows #include <LovyanGFX.hpp> into the library before deciding
; what to compile.
lib_ldf_mode = chain+
; If your module has 16MB flash (N16R8), uncomment the next line:
; board_upload.flash_size = 16MB

build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D CORE_DEBUG_LEVEL=3
    -D BOARD_HAS_PSRAM
    ; --- Retro-Go: target selection and tuning (replaces base.cmake) ---
    -D RG_TARGET_MY_S3_ST7789=1
    -D RETRO_GO=1
    -D RG_ENABLE_NETWORKING=0
    -D RG_UPDATER_ENABLE=0
    -D RG_PROJECT_APP='"nes"'
    -D RG_SINGLE_APP=1
    ; --- LovyanGFX ---
    ; The efont/IPA tables in LovyanGFX are ~120MB of C source. They are not
    ; used (Chinese glyphs come from src/rg_core/fonts/efontCN16.c), so skip them.
    -D LGFX_DISABLE_LARGE_FONTS=1
    -fjump-tables
    -ftree-switch-conversion
    -O2
    -Wno-unused-function
    ; --- Include paths ---
    -I src/rg_core
    -I src/rg_core/libs/cJSON
    -I src/rg_core/libs/lodepng
    -I src/nofrendo
